# Cache policy reference. The platform server (server/src/app.js) applies the
# same rules. Railway runs that Node process, not this nginx file.
server {
  # Rewritten to $PORT at container start. 8080 is the local default.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # The engine is ~110 KB of JavaScript; gzip makes the first paint much cheaper.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  # The app is one page driven by query params (?case=, ?preview=), so there is
  # nothing to rewrite. A missing path 404s instead of returning the HTML shell
  # with a 200, which would hide a typo'd script or image.
  location / {
    try_files $uri $uri/ =404;
  }

  # Art is written once and never edited in place. ^~ keeps these prefixes ahead
  # of any other matching location.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Code and case packs change when the product changes. Keep the window short
  # so a deploy is visible without asking anyone to hard-refresh.
  location ^~ /app/ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
  }
  location ^~ /cases/ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
  }
}
