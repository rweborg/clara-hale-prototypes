server {
  # Rewritten to $PORT at container start. 8080 is the local default.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # The engine is ~120 KB of JavaScript; gzip makes the first paint much cheaper.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # A missing asset must 404. Falling back to index.html would return HTML with
  # a 200 for a typo'd script or image, which hides the mistake.
  location ~* \.[a-z0-9]{2,5}$ {
    try_files $uri =404;
  }

  # Art is written once and never edited in place.
  # ^~ stops the regex location below from taking these paths over.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Code and case packs change when the product changes. Keep the window short
  # so a deploy is visible without asking anyone to hard-refresh.
  location ^~ /app/ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
  }
  location ^~ /cases/ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
  }
}
