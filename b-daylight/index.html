body{background:var(--bg);font-family:Atkinson,Arial,sans-serif;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
.top{position:fixed;left:0;right:0;top:0;height:64px;z-index:50;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--barink);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.ttl b{display:block;font:700 18px Atkinson}.ttl span{font:13px Atkinson;opacity:.75}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;font:700 14px Atkinson;white-space:nowrap}
.dots{display:flex;gap:4px}.dots i{width:22px;height:6px;border-radius:3px;background:currentColor;opacity:.25}.dots i.on{opacity:1;background:var(--accent)}
.seg{display:flex;background:rgba(127,127,127,.18);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:44px;padding:0 16px;border-radius:9px;border:none;background:none;font:700 15px Atkinson;white-space:nowrap}
.seg button.on{background:#fff;color:#1D1B18;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tb{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid currentColor;background:transparent;font:700 15px Atkinson;white-space:nowrap}
.tb.small{border-color:transparent;opacity:.75;padding:0 8px}
/* desk */
#desk,#board{position:fixed;inset:0}
.fit{position:absolute;left:0;top:0;transform-origin:0 0}
.deskimg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot{position:absolute;display:block;border:none;background:transparent;border-radius:6px;outline:2px solid transparent;transition:outline-color .15s,box-shadow .15s;z-index:3}
.hot:hover,.hot:focus-visible{outline-color:rgba(255,200,60,.95);box-shadow:0 0 0 6px rgba(255,200,60,.25)}
.hot.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.0)}50%{box-shadow:0 0 0 10px rgba(242,193,78,.45)}}
.tag{position:absolute;left:50%;bottom:10px;transform:translateX(-50%) rotate(calc(var(--r,0) * -1deg));white-space:nowrap;background:rgba(17,17,17,.8);color:#fff;font:700 15px Atkinson;padding:8px 14px;border-radius:999px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:none}
.tag em{font-style:normal;font-weight:400;opacity:.85;font-size:13px;border-left:1px solid rgba(255,255,255,.35);padding-left:8px}
.tag.go{background:#F2C14E;color:#1D1B18}.tag .new{background:#E5463A;color:#fff;border-radius:999px;padding:1px 7px;font-size:12px}
.deskcard{position:fixed;right:22px;top:80px;z-index:20;width:330px}
.mdesk{display:none}
/* next step */
.next{background:#fff;color:#1D1B18;border-radius:14px;padding:16px 18px 14px;box-shadow:0 12px 32px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.05)}
.nk{font:700 12px Atkinson;letter-spacing:.12em;text-transform:uppercase;color:#B4562E}.nt{font:700 20px/1.2 Atkinson;margin:4px 0}
.next p{font:15px/1.45 Atkinson;color:#4A443C;margin-bottom:12px}.ns{font:13px Atkinson;color:#7A7268;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;width:100%;border-radius:11px;border:none;background:var(--btn);color:#fff;font:700 16px Atkinson;padding:0 16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:11px;background:#fff;color:#1D1B18;font:700 15px Atkinson;box-shadow:0 2px 10px rgba(0,0,0,.2);border:none}
.btn2.on{background:#F2C14E}.btn2:disabled{opacity:.5}
/* overlay */
#ov{position:fixed;inset:128px 0 0 0;z-index:40;display:none;overflow:auto}
#ov.show{display:block}
#ovbg{position:fixed;inset:0;z-index:39;display:none;background-size:cover;background-position:center;filter:blur(9px) brightness(.5);transform:scale(1.05)}
#ovbg.show{display:block}
.back{position:fixed;left:18px;top:78px;z-index:45}
.ovw{min-height:100%;padding:8px 22px 28px;display:flex;gap:22px;align-items:flex-start;justify-content:center}
.side{width:320px;flex:none;display:flex;flex-direction:column;gap:14px}
.panel{background:#fff;color:#1D1B18;border-radius:14px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.panel h3{font:700 18px Atkinson;margin-bottom:8px}.panel p{font:15px/1.45 Atkinson;color:#4A443C}
.starlist{list-style:none;font:15px/1.4 Atkinson}.starlist li{border-top:1px solid #EEE7DA;padding:7px 0}.starlist small{display:block;color:#7A7268;font-size:12.5px}
.empty{color:#8A8378;font-size:14px}
/* phone */
.phone{width:min(350px,92vw);height:min(740px,calc(100vh - 168px));min-height:560px;border-radius:56px;background:linear-gradient(145deg,#3A3C41,#1B1C1F 40%,#2B2D31);padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 0 0 2px #55585E,inset 0 0 0 4px #141518;position:relative;flex:none}
.phone:before{content:'';position:absolute;right:-3px;top:150px;width:4px;height:70px;border-radius:2px;background:#2B2D31}
.screen{position:relative;width:100%;height:100%;border-radius:45px;background:#0B0B0D;color:#F2F2F4;overflow:hidden;display:flex;flex-direction:column}
.island{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:110px;height:32px;border-radius:20px;background:#000;z-index:3}
.sbar{display:flex;justify-content:space-between;padding:16px 30px 0;font:700 15px Atkinson;height:50px;flex:none}
.app{flex:1;display:flex;flex-direction:column;min-height:0}
.apph{padding:6px 20px 8px;flex:none}.apph h2{font:700 32px Atkinson}.apph p{color:#8E8E93;font-size:14px}
.reclist{flex:1;overflow:auto;padding:0 20px}
.rec{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #2A2A2E;padding:12px 0;min-height:62px;color:#F2F2F4}
.rec b{display:block;font:700 17px Atkinson}.rec span{display:flex;justify-content:space-between;color:#8E8E93;font-size:14px;margin-top:3px}
.rec.locked{opacity:.45}.rec .hd{color:#5BD07A}
.pl{flex:1;display:flex;flex-direction:column;min-height:0}
.plh{display:flex;align-items:center;padding:4px 14px;flex:none}.plh button{background:none;border:none;color:#5E9CFF;font:700 16px Atkinson;min-height:44px;padding:0 6px}
.plt{padding:0 20px;flex:none}.plt b{font:700 21px Atkinson;display:block}.plt span{color:#8E8E93;font-size:14px}
.wfw{position:relative;margin:12px 20px 0;height:54px;flex:none}
.wfw svg{position:absolute;inset:0;width:100%;height:100%}
.wfw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.ph{position:absolute;top:-4px;bottom:-4px;width:2px;background:#E5463A;border-radius:1px;pointer-events:none}
.times{display:flex;justify-content:space-between;color:#8E8E93;font:13px Atkinson;padding:4px 20px 0;flex:none}
.ctl{display:flex;justify-content:space-around;align-items:center;padding:6px 26px 8px;flex:none}
.ctl button{background:none;border:none;color:#fff;min-width:52px;min-height:52px;font:700 15px Atkinson;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ctl .big{width:64px;height:64px;border-radius:50%;background:#fff;color:#0B0B0D;font-size:24px}
.ctl small{font-size:11px;color:#8E8E93}
.trans{flex:1;overflow:auto;padding:4px 14px 18px;border-top:1px solid #222;scroll-behavior:smooth}
.ln{display:grid;grid-template-columns:1fr 40px;gap:4px;padding:8px 8px;border-radius:12px;color:#8E8E93;font:16px/1.4 Atkinson;cursor:pointer}
.ln .sp{display:block;font:700 12px Atkinson;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.ln.past{color:#C9C9CE}.ln.cur{color:#fff;background:#1E2A3A}.ln.cur .sp{color:#5E9CFF}
.st{width:40px;height:40px;border:none;background:none;font-size:20px;color:#6E6E73;line-height:1}.st.on{color:#F2C14E}
.light .st{color:#7A8484}.light .st.on{color:#C98A00}
.voice{font-size:12px;color:#8E8E93;padding:0 20px 6px;display:flex;justify-content:space-between;align-items:center}
.voice button{background:#1C1C1F;border:1px solid #333;color:#ddd;border-radius:999px;padding:4px 10px;min-height:32px;font:700 12px Atkinson}
/* recorder */
.recw{display:flex;flex-direction:column;gap:12px;width:380px;flex:none}
.recimg{width:380px;height:min(434px,calc(100vh - 480px));object-fit:contain;filter:drop-shadow(0 20px 30px rgba(0,0,0,.5))}
.deck{background:rgba(20,20,20,.9);border-radius:16px;padding:14px;color:#F2EEE6;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.counter{display:flex;align-items:baseline;gap:8px;font:700 12px Atkinson;letter-spacing:.08em;color:#BDB6AA}.counter b{margin-left:auto;font:700 26px CourierP;color:#F2C14E;letter-spacing:0}
.deck .wfw{margin:8px 0;height:40px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.keys button{min-height:58px;border-radius:10px;border:none;background:linear-gradient(#4A4D52,#34373B);box-shadow:0 3px 0 #1A1B1D;color:#fff;font:700 18px Atkinson;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.keys button small{font:700 10.5px Atkinson;opacity:.85}.keys button.on{background:#F2C14E;color:#1D1B18;box-shadow:0 1px 0 #8A6A1A;transform:translateY(2px)}
.tapes{display:grid;grid-template-columns:1fr;gap:8px}
.tape{display:flex;align-items:center;gap:10px;min-height:54px;border:none;border-radius:10px;background:#F4EFE6;padding:6px 10px;text-align:left;box-shadow:0 1px 0 rgba(0,0,0,.1)}
.tape i{font-style:normal;width:46px;height:30px;border-radius:4px;background:linear-gradient(#E9A03B 0 40%,#2A2A2A 40% 70%,#E9A03B 70%);flex:none;position:relative}
.tape i:after{content:'';position:absolute;left:9px;right:9px;top:13px;height:5px;border-radius:3px;background:radial-gradient(circle at 20% 50%,#ddd 2px,transparent 3px),radial-gradient(circle at 80% 50%,#ddd 2px,transparent 3px)}
.tape b{display:block;font:700 15px Atkinson}.tape small{color:#6A6258;font-size:12.5px}.tape.on{outline:3px solid var(--btn)}.tape.locked{opacity:.5}
.tape .hd{margin-left:auto;color:#1F7A4A;font-weight:700;font-size:13px}
.form{background:#8FD3CB;border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.45);color:#1C2626;width:560px;max-width:100%;display:flex;flex-direction:column;max-height:calc(100vh - 160px)}
.form.vm{background:#D9DEE6}.form.nar{background:#F2E6C8}
.fh{display:flex;align-items:center;gap:12px;background:#1E2A2A;color:#fff;padding:10px 16px;font:400 16px ArchivoBlack,Arial Black;flex:none}
.fh em{margin-left:auto;font:700 12px Atkinson;font-style:normal;opacity:.85}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;padding:10px 16px 4px;flex:none}
.ff div{display:flex;gap:8px;align-items:baseline;border-bottom:1.5px solid rgba(0,0,0,.45)}.ff span{font:700 10.5px Atkinson;letter-spacing:.06em;opacity:.8}.ff b{font:400 22px/1.1 Caveat;color:#152A6B}
.fs{font:700 11px Atkinson;letter-spacing:.12em;padding:8px 16px 4px;opacity:.8;flex:none}
.fb{margin:0 16px 14px;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.2);overflow:auto;flex:1;min-height:200px;scroll-behavior:smooth}
.fl{display:grid;grid-template-columns:48px 100px 1fr 40px;gap:6px;padding:6px 8px 6px 10px;font:15px/1.42 CourierP,'Courier New',monospace;border-bottom:1px solid rgba(0,0,0,.1);cursor:pointer}
.fl .ft{font:700 12px Atkinson;color:#2A6070;padding-top:3px}.fl b{font:700 13px CourierP;padding-top:1px}
.fl.cur .fx{background:linear-gradient(transparent 8%,rgba(255,236,80,.9) 8%,rgba(255,236,80,.9) 92%,transparent 92%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.fl.fut{opacity:.55}
/* folder */
.stagebox{position:relative;overflow:hidden;margin:0 auto}
.fstage{position:relative;width:1280px;height:800px;transform-origin:0 0}
.fstage>img{position:absolute;inset:0;width:1280px;height:800px}
.pg{position:absolute;top:199px;width:377px;height:402px;padding:16px 18px;color:#1D1B18;overflow:hidden}
.pg.l{left:184px}.pg.r{left:718px;background:transparent}
.pgk{font:700 11px Atkinson;letter-spacing:.12em;color:#6A6258;display:flex;justify-content:space-between;border-bottom:1.5px solid #1D1B18;padding-bottom:6px;margin-bottom:8px}
.toc{list-style:none}.toc button{display:flex;width:100%;justify-content:space-between;align-items:center;min-height:40px;border:none;border-bottom:1px dashed rgba(0,0,0,.25);background:none;font:16px Atkinson;padding:0 6px;text-align:left}
.toc button i{font-style:normal;font:14px CourierP}.toc button.cur{background:rgba(255,236,80,.75);font-weight:700}.toc button.seen span:before{content:'✓ ';color:#1F5E4E;font-weight:700}
.pgn{font:700 23px Atkinson;margin-bottom:6px}.pg dl{display:grid;grid-template-columns:52px 1fr;gap:5px 8px;font:15px/1.35 Atkinson}.pg dt{font-weight:700;color:#6A6258}
.pg p{font:15px/1.45 Atkinson;margin-bottom:8px}.hand{font:400 22px/1.15 Caveat;color:#1B2A6E}
.pg ul.tl{list-style:none;font:14px/1.35 Atkinson}.pg ul.tl li{display:grid;grid-template-columns:86px 1fr;gap:6px;padding:4px 0;border-bottom:1px solid #E6E0D6}.pg ul.tl b{font:700 13px CourierP}
.curl{position:absolute;right:0;bottom:0;width:110px;height:110px;border:none;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.12) 50%,#EDE9DF 56%,#FBFAF6 75%);display:flex;align-items:flex-end;justify-content:flex-end;padding:10px}
.curl span{white-space:nowrap;font:700 13px Atkinson;background:#1D1B18;color:#fff;border-radius:999px;padding:6px 10px}
.flip{position:absolute;left:718px;top:199px;width:377px;height:402px;background:#FBFAF6;transform-origin:0 50%;box-shadow:0 0 30px rgba(0,0,0,.25);z-index:5;animation:flip .5s ease-in forwards}
.flip.rev{animation:fliprev .5s ease-in forwards}
@keyframes flip{to{transform:perspective(1600px) rotateY(-178deg);opacity:.2}}
@keyframes fliprev{from{transform:perspective(1600px) rotateY(-178deg);opacity:.2}to{transform:none;opacity:1}}
.tabs{position:absolute;left:1095px;top:212px;display:flex;flex-direction:column;gap:6px}
.tabs button{display:flex;align-items:center;min-height:48px;padding:0 14px 0 12px;border:none;border-radius:0 10px 10px 0;background:#E9D9B5;font:700 15px Atkinson;color:#3A2E1E;box-shadow:2px 2px 6px rgba(0,0,0,.2)}
.tabs button.on{background:#FBFAF6;color:#1D1B18}
.fctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fnarrow{display:none}
.paper{background:#FBFAF6;color:#1D1B18;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.35);padding:18px;position:relative}
/* bag */
.bagw{position:relative;width:min(580px,calc(100vh - 230px));aspect-ratio:1;flex:none;perspective:1600px}
.bagin{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.bagw.flipped .bagin{transform:rotateY(180deg)}
.bagface,.bagback{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bagface img,.bagback img{width:100%;height:100%;filter:drop-shadow(0 26px 40px rgba(0,0,0,.5))}
.bagback{transform:rotateY(180deg)}.bagback img{transform:scaleX(-1);filter:blur(2px) brightness(1.05) drop-shadow(0 26px 40px rgba(0,0,0,.5))}
.custody{position:absolute;left:28%;top:28%;width:44%;background:rgba(255,255,255,.95);padding:12px 14px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.25);color:#1D1B18}
.custody .k{font:700 11px Atkinson;letter-spacing:.12em;color:#B3141B;margin-bottom:6px}.custody div.r{font:12px Atkinson;border-bottom:1px solid #ccc;padding:4px 0}.custody div.r span{display:block;color:#6A6258;font-size:11px}.custody div.r b{font:400 19px Caveat;color:#1B2350}
.loupe{position:absolute;width:220px;height:220px;border-radius:50%;border:9px solid #2B2B2B;box-shadow:0 14px 30px rgba(0,0,0,.55),inset 0 0 18px rgba(0,0,0,.3);background-repeat:no-repeat;pointer-events:none;display:none;z-index:4}
.loupe:after{content:'';position:absolute;right:-48px;bottom:-48px;width:70px;height:20px;background:#2B2B2B;border-radius:6px;transform:rotate(45deg)}
.bagw.mag .loupe{display:block}.bagw.mag{cursor:none}
.ledgerfull{max-width:100%;width:600px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
/* envelope */
.envw{position:relative;width:640px;max-width:100%;flex:none}
.envs{position:relative;width:640px;height:400px;max-width:100%;transform:rotate(-2deg);filter:drop-shadow(0 20px 26px rgba(0,0,0,.4))}
.envs img.e{position:absolute;inset:0;width:100%;height:100%}
.strip{position:absolute;left:0;right:0;top:-6px;height:30px;border:none;background:transparent;cursor:grab;touch-action:none}
.strip:before{content:'';position:absolute;left:12px;right:12px;top:16px;border-top:3px dashed rgba(255,255,255,.85)}
.strip span{position:absolute;left:12px;top:-34px;background:#1D1B18;color:#fff;font:700 13px Atkinson;padding:5px 10px;border-radius:999px}
.strip .grip{position:absolute;top:2px;width:34px;height:30px;border-radius:8px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center;font-size:16px;color:#1D1B18}
.envs.tearing .stripimg{animation:tear .7s ease-in forwards}
.stripimg{position:absolute;left:0;top:-4px;width:100%;pointer-events:none}
@keyframes tear{to{transform:translate(280px,-260px) rotate(28deg);opacity:0}}
.lock{position:absolute;inset:auto 20px 20px 20px;background:rgba(255,255,255,.95);border-radius:12px;padding:12px 14px;color:#1D1B18;font:15px Atkinson;display:flex;gap:10px;align-items:center}
.torn{width:640px;max-width:100%;animation:rise .6s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.it{display:flex;align-items:center;gap:10px;min-height:54px;border-top:1px solid #E6E0D6;width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left}.it span{font-size:20px}.it b{display:block;font:700 15px Atkinson}.it small{font:13px Atkinson;color:#6A6258}
.it i{margin-left:auto;font-style:normal;font:700 13px Atkinson;background:#EFE9DE;border-radius:8px;padding:8px 10px}
.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:60;background:#1F5E4E;color:#fff;font:700 16px Atkinson;padding:12px 20px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.35);animation:rise .4s}
/* objective */
.obj{width:640px;max-width:100%}
.q{margin:14px 0}.q>b{display:block;font:700 17px Atkinson;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;min-height:50px;width:100%;text-align:left;border:2px solid #E2DACB;border-radius:10px;background:#fff;padding:8px 12px;margin:6px 0;font:15px/1.35 Atkinson}
.opt.sel{border-color:var(--btn);background:#EEF5F2}.opt i{width:20px;height:20px;border-radius:50%;border:2px solid #9A9184;flex:none}.opt.sel i{border:6px solid var(--btn)}
.fb2{padding:10px 12px;border-radius:10px;font:700 15px Atkinson;margin:10px 0}.fb2.bad{background:#FBE9E5;color:#9B1C1C}.fb2.good{background:#E3F3EA;color:#1F5E4E}
.demo{background:none;border:none;color:#7A7268;text-decoration:underline;font-size:13px;margin-top:10px;min-height:36px}
/* sheet/pad/news */
.sheetimg{width:620px;max-width:100%;box-shadow:0 18px 40px rgba(0,0,0,.4);transform:rotate(-1deg)}
.pad{width:560px;max-width:100%;background:#F8EB8C;border-top:28px solid #7A1E22;border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.4);padding:14px 18px 18px 64px;position:relative;background-image:repeating-linear-gradient(transparent 0 35px,#8DB6D8 35px 36px);background-position:0 8px}
.pad:before{content:'';position:absolute;left:52px;top:0;bottom:0;border-left:2px solid #D98080}
.pad textarea{width:100%;min-height:300px;border:none;background:transparent;font:400 25px/36px Caveat;color:#1B2A6E;resize:vertical;outline:none}
.pad .pst{font:400 23px/36px Caveat;color:#1B2A6E}
.newsw{width:640px;max-width:100%;transform-origin:50% 0;animation:unfold .7s cubic-bezier(.2,.8,.2,1)}
@keyframes unfold{0%{transform:perspective(1200px) rotateX(70deg) scaleY(.5);opacity:.4}100%{transform:none;opacity:1}}
.newsw img{width:100%;box-shadow:0 18px 40px rgba(0,0,0,.4)}
/* board */
.bwrapo{position:fixed;left:14px;top:78px;right:300px;bottom:76px;display:flex;align-items:flex-start;justify-content:center}
.bwrap{position:relative;aspect-ratio:16/10;width:min(100%,calc((100vh - 154px) * 1.6));border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bwrap>img{position:absolute;left:-2%;top:-2%;width:104%;height:104%}
.bsvg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.bsvg line{stroke:transparent;stroke-width:4;stroke-linecap:round}
.bsvg line.hit{pointer-events:stroke;stroke:transparent;stroke-width:22;cursor:pointer}
.bsvg line.on{stroke:#FF2A1F;stroke-width:6;filter:drop-shadow(0 0 6px rgba(255,60,40,.9))}
.bshade{position:absolute;inset:0;background:rgba(20,14,8,.45);z-index:1;opacity:0;transition:opacity .2s;pointer-events:none}
.bwrap.sel .bshade{opacity:1}
.bi{position:absolute;z-index:3;border:none;background:transparent;border-radius:4px;outline:3px solid transparent;transition:outline-color .15s,box-shadow .15s}
.bi:hover,.bi:focus-visible{outline-color:rgba(255,214,90,.95)}
.bi.rel{outline-color:#FF5A3C;box-shadow:0 0 0 6px rgba(255,90,60,.3);z-index:4}.bi.me{outline-color:#F2C14E;box-shadow:0 0 0 8px rgba(242,193,78,.4);z-index:4}
.bwrap.sel .bi:not(.rel):not(.me){filter:brightness(.6)}
.blab{position:absolute;z-index:5;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#1D1B18;border-radius:7px;padding:3px 8px;font:700 12.5px/1.2 Atkinson;text-align:center;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.blab small{display:block;font:400 11.5px Atkinson;color:#5A544C}.blab.miss{background:#B3141B;color:#fff}.blab.miss small{color:#FFD9D9}.blab.place{background:#1D1B18;color:#fff}
.bside{position:fixed;right:14px;top:78px;bottom:14px;width:272px;z-index:15;display:flex;flex-direction:column;gap:12px;overflow:auto}
.chips{position:fixed;left:14px;bottom:16px;z-index:15;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips .btn2{min-height:46px}
.selp img{width:100%;max-height:150px;object-fit:contain;background:#F2EEE6;border-radius:8px;margin-bottom:8px}
.conn{display:block;width:100%;text-align:left;border:none;background:#F6F1E8;border-radius:9px;padding:8px 10px;margin-top:6px;font:14px/1.35 Atkinson;min-height:44px}.conn b{display:block}
.newtray .it{min-height:48px}
.mlist{display:none}
.big-img{max-width:100%;max-height:70vh;box-shadow:0 18px 40px rgba(0,0,0,.4);background:#fff}
/* mobile */
@media (max-width:760px){
 body{overflow:auto}
 .top{position:sticky;height:auto;flex-wrap:wrap;padding:10px 12px;gap:8px}.ttl span,.prog{display:none}.ttl b{font-size:17px}
 .top .tb{margin-left:auto}.top .tb.small{margin-left:0}
 .seg{order:5;width:100%}.seg button{flex:1;justify-content:center}
 #desk,#board{position:static}
 .fit,.deskcard{display:none}
 .mdesk{display:block}.mdesk .next{margin:12px}
 .mdesk .mimg{position:relative;width:100%;aspect-ratio:780/1300}
 .mdesk .mimg img{position:absolute;inset:0;width:100%;height:100%}
 .tag{font-size:13px;padding:7px 11px;bottom:6px}
 #ov{position:fixed;inset:0;top:0;z-index:55;background:var(--bg);padding-top:68px}
 .back{position:fixed!important;z-index:60}
 #ovbg{display:none!important}
 .back{top:0;left:0;right:0;display:block;padding:10px 12px;background:var(--bar)}
 .back .btn2{width:100%}
 .ovw{flex-direction:column;align-items:stretch;padding:12px}
 .side{width:auto}
 .phone{margin:0 auto;height:680px}
 .recw{width:100%}.recimg{width:100%;height:auto;max-height:300px}
 .form{width:100%;max-height:none}.fb{max-height:420px}
 .fl{grid-template-columns:42px 1fr 36px;font-size:14px}.fl b{grid-column:2}.fl .fx{grid-column:2}.fl .st{grid-column:3;grid-row:1/3}
 .fwide{display:none}.fnarrow{display:block}
 .bagw{width:100%}.bagface img,.bagback img{width:100%;height:auto}

 .envs{width:100%;height:auto;aspect-ratio:1.6}
 .bwrapo{position:static;padding:10px}.bwrap{width:100%}
 .blab{display:none}

<script>window.CONFIG={"ver": "B", "assets": {"desk": "assets/desk.jpg", "mdesk": "assets/desk-mobile.jpg", "board": "assets/board.jpg", "folder": "assets/folder.webp", "bag": "assets/bag.webp", "torn": "assets/envelope-a-open.webp", "env": "assets/envelope-a.jpg", "strip": "assets/envelope-a-strip.webp", "ledger": "assets/ledger.jpg", "sheet": "assets/instructions.jpg", "news": "assets/newspaper.jpg", "map": "assets/map.jpg", "report": "assets/form-report.jpg", "print_clara": "assets/print-clara.jpg", "print_daniel": "assets/print-daniel.jpg", "print_marcy": "assets/print-marcy.jpg", "print_reed": "assets/print-reed.jpg", "print_jesse": "assets/print-jesse.jpg", "print_dunn": "assets/print-dunn.jpg", "print_ortiz": "assets/print-ortiz.jpg", "doc_card_festival": "assets/doc-card-festival.jpg", "doc_card_trailhead": "assets/doc-card-trailhead.jpg", "doc_map": "assets/doc-map.jpg", "doc_form_report": "assets/doc-form-report.jpg", "doc_card_bakery": "assets/doc-card-bakery.jpg", "doc_ledger": "assets/doc-ledger.jpg", "doc_newspaper": "assets/doc-newspaper.jpg", "doc_sticky_seat": "assets/doc-sticky-seat.jpg", "doc_sticky_vm": "assets/doc-sticky-vm.jpg", "doc_sticky_photo": "assets/doc-sticky-photo.jpg"}, "scripts": {"00": {"title": "Opening narration", "short": "Opening narration", "sub": "Det. Sam Ortiz · case briefing", "person": "Det. Sam Ortiz", "role": "Montana State Police", "date": "1 of 7", "stage": 1, "dur": 92.7, "lines": [{"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Pine Hollow, Montana. Population eleven hundred and change. One stoplight, two churches, and a bakery on Main Street that's been the warmest room in town for six years.", "t": 0.0, "d": 10.37}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Saturday night was the Harvest Festival. Cider, kettle corn, a brass band that knows four songs. Battery-lit paper lanterns strung all along the north field, where the lake path starts into the pines.", "t": 10.97, "d": 12.22}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Clara Hale, thirty-four, owner of Hale's Bakery, was seen at that festival a little after nine. By seven the next morning, her Subaru was sitting at the Copper Lake trailhead. Doors unlocked. Keys in the ignition. Her phone, gone. Clara, gone.", "t": 23.79, "d": 15.19}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "My name is Sam Ortiz. State police, out of Helena. They sent me up because the sheriff's office here is three deputies and a dog, and one of those deputies used to date the missing woman.", "t": 39.58, "d": 13.33}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Everybody in Pine Hollow knows everybody. That's the problem. Everybody has a reason to say something. And everybody has a reason to leave something out.", "t": 53.51, "d": 9.26}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Five people. Her husband, halfway through a divorce over that bakery. Her business partner. The pastor who saw her last. The kid who ran. And the deputy who was supposed to find her.", "t": 63.37, "d": 12.22}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "So listen carefully. Watch the clock. Watch what people know, and when they say they knew it. Somebody in these rooms is lying to me. Most of them, actually. Only one of them is lying about Clara.", "t": 76.19, "d": 13.7}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Let's begin.", "t": 90.5, "d": 1.6}]}, "01": {"title": "Daniel Hale — interview", "short": "Daniel Hale", "sub": "Interview · Clara's husband", "person": "Daniel Hale", "role": "Husband (separating)", "date": "2 of 7", "stage": 1, "dur": 249.7, "lines": [{"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Daniel Hale. Thanks for coming in.", "t": 0.0, "d": 2.22}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "Did I have a choice? Your people were on my porch at seven in the morning.", "t": 2.82, "d": 5.93}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You had a choice. You chose to come. I appreciate it. Your wife has been missing since Saturday night.", "t": 9.35, "d": 7.04}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "Soon-to-be ex-wife. Go ahead and say it. Everybody else in this town does.", "t": 16.99, "d": 4.81}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Tell me about the divorce.", "t": 22.4, "d": 1.85}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "It's a divorce. Two people who used to like each other, fighting over the one thing they built. The bakery. My name's on that sign, Detective. I put up half the down payment. I laid the brick around those ovens with my own hands.", "t": 24.85, "d": 16.3}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "And Clara wanted to keep it.", "t": 41.75, "d": 2.22}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "Clara wanted to keep everything. Her lawyer, Ruth Kessler, sends me letters with words in them I have to look up.", "t": 44.57, "d": 7.78}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Where were you Saturday night?", "t": 52.95, "d": 1.85}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "Home. Watched the Griz game. Alone. And no, nobody can vouch for me. That what you want to hear?", "t": 55.4, "d": 7.04}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Were you at the festival at all?", "t": 63.04, "d": 2.59}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "I don't go where she goes. That's practically in the paperwork.", "t": 66.23, "d": 4.07}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "What about the lake? The trailhead lot off Route 9.", "t": 70.9, "d": 4.9}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "...Why?", "t": 76.41, "d": 1.6}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "There's a boot print beside your wife's car. Size thirteen work boot, heel worn down on the left. You wear Red Wings, Mr. Hale.", "t": 78.61, "d": 8.89}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "Half of Montana wears Red Wings!", "t": 88.1, "d": 2.22}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Worn left heel. You favor your left leg. I noticed when you walked in.", "t": 90.92, "d": 5.19}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "...I was there. In the afternoon. Not at night.", "t": 96.7, "d": 3.33}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Tell me.", "t": 100.64, "d": 1.6}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "She texted me. Said she wanted to talk without lawyers. We met at the trailhead around four. That's where I where I proposed. Fourteen years ago. I thought maybe... I don't know what I thought.", "t": 102.84, "d": 12.96}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "What did you talk about?", "t": 116.4, "d": 1.85}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "Not us. That's the thing. I go in thinking she wants to settle, and she spends twenty minutes asking whether I ever took cash out of the register back when I was still doing deliveries. I said, Clara, I haven't touched that register in a year. And she says, \"I know. I had to ask. Something's wrong with the books.\" Then she says, \"It's not you.\" Like that's supposed to make me feel better.", "t": 118.85, "d": 27.41}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Did she say who?", "t": 146.86, "d": 1.6}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "No. She got that look. Lips pressed tight. She does that when she's already decided something and isn't ready to say it out loud.", "t": 149.06, "d": 8.89}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Can you prove what time you were there?", "t": 158.55, "d": 2.96}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "...Yeah. I took a picture. Of the dock. Stupid. Here. Three fifty-two PM. Location's on it, too.", "t": 162.11, "d": 6.3}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "I'll need a copy. Was Clara's car still there when you left?", "t": 169.01, "d": 4.44}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "She left first. Ten after four, maybe. I sat in my truck a while. Then I went home.", "t": 174.05, "d": 6.67}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "One more thing. When we found her car, the driver's seat was pulled all the way forward.", "t": 181.32, "d": 6.3}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "Forward? That's... no. Clara's five-ten. She's all legs. She drives with that seat shoved back so far I used to joke she was steering with her toes.", "t": 188.21, "d": 10.0}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "And you're, what, six-two?", "t": 198.81, "d": 1.6}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "Six-three. If I'd driven it, the seat would be in the trunk. Somebody else drove her car.", "t": 201.01, "d": 6.3}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "I didn't say that.", "t": 207.91, "d": 1.6}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "You didn't have to! Somebody small drove my wife's car out to that lake, and you're in here looking at my boots!", "t": 210.11, "d": 8.15}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Sit down, Mr. Hale.", "t": 218.86, "d": 1.6}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "...", "t": 221.06, "d": 3.0}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Who else had access to the bakery's books?", "t": 224.66, "d": 2.96}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "Clara did the books. Old school, big green ledger, pencil. Marcy did ordering and ran the register most days. Jesse, the kid, he bakes and mops. Clara trusted Marcy like a sister. More than she ever trusted me.", "t": 228.22, "d": 14.07}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Anything else I should know?", "t": 242.9, "d": 1.85}, {"sp": "DANIEL", "name": "Daniel Hale", "tag": "HALE", "text": "Yeah. Find her. Whatever happened between us. Just find her.", "t": 245.35, "d": 3.7}]}, "02": {"title": "Jesse Cole — interview", "short": "Jesse Cole", "sub": "Interview · bakery worker, 19", "person": "Jesse Cole", "role": "Bakery worker, 19", "date": "3 of 7", "stage": 1, "dur": 211.6, "lines": [{"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Jesse. You want some water?", "t": 0.0, "d": 1.85}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "No. I'm good. Am I under arrest?", "t": 2.45, "d": 2.59}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "No. You're here because you work for Clara, and you left town the night she disappeared. Your cousin's place in Missoula. Two days.", "t": 5.64, "d": 8.52}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "I came back. I came back on my own.", "t": 14.76, "d": 3.33}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You did. Why'd you leave?", "t": 18.7, "d": 1.85}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "...You already know why.", "t": 21.15, "d": 2.8}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Tell me anyway.", "t": 24.55, "d": 1.6}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "I've got a record. Juvie. It's sealed, but it's Pine Hollow. Sealed means everybody knows and nobody says. I took a car when I was fifteen. A car. And then Clara's car shows up at the lake with the keys in it? Who do you think Deputy Dunn knocks on first?", "t": 26.75, "d": 18.89}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "How'd you hear about the car?", "t": 46.24, "d": 2.22}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "Scanner app. Everybody has it. Early Sunday morning I hear \"Clara Hale's vehicle,\" and I just... drove.", "t": 49.06, "d": 6.3}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Let's go back to Saturday. You were working the bakery booth.", "t": 55.96, "d": 4.07}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "Yeah. Booth fourteen. Cider donuts, pumpkin bread. And the lanterns. Marcy had this idea to sell paper lanterns, the battery ones, with the booth number on the bottom so people bring them back for a dollar.", "t": 60.63, "d": 13.33}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "The booth number on the bottom.", "t": 74.56, "d": 2.22}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "Sharpie. Marcy wrote them herself. \"One-four.\" Big.", "t": 77.39, "d": 2.59}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "When did you leave the booth?", "t": 80.58, "d": 2.22}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "Like... quarter to nine.", "t": 83.4, "d": 1.6}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Early. The festival ran to ten.", "t": 85.6, "d": 2.22}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "Marcy told me to go. She gave me forty bucks out of the cash box and said, \"Go have fun, I'll close up.\" That was weird. Marcy counts every penny. She makes me write it down if I eat a broken cookie.", "t": 88.42, "d": 15.56}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Where was Clara then?", "t": 104.58, "d": 1.6}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "She came by around eight-thirty, maybe. She and Marcy went around behind the booth. I couldn't hear much. Clara said something like, \"Don't make me do this.\" And Marcy was doing that thing where she talks really fast and laughs at nothing.", "t": 106.78, "d": 15.56}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "And after you left?", "t": 122.93, "d": 1.6}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "I walked around. Got a corn dog. Saw some guys from school. Then I went home. My mom was up. She'll tell you I was home by ten.", "t": 125.13, "d": 10.37}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Anything strange at the bakery lately? This week, last week.", "t": 136.1, "d": 3.7}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "...Thursday. Before the festival. I took out the recycling. The paper bin was full of shredded stuff. Like, a lot. Green paper, with lines.", "t": 140.41, "d": 8.89}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Green paper.", "t": 149.9, "d": 1.6}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "Like the ledger. Clara does the books by hand, she's got that big green ledger. But we don't even have a shredder. Marcy brought one from home on Wednesday. Said it was for \"old invoices.\"", "t": 152.1, "d": 12.96}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Did you tell anybody?", "t": 165.66, "d": 1.6}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "Tell who? I'm the kid with the record. I'm not gonna point at my boss.", "t": 167.86, "d": 5.56}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You just did.", "t": 174.01, "d": 1.6}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "No. No, I'm not saying anything. I'm just saying there was paper. That's all. Please don't write down that I said that.", "t": 176.21, "d": 8.15}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Jesse. Did you hurt Clara?", "t": 184.96, "d": 1.85}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "No. She gave me a job when nobody else would. She let me take day-old bread home for my little sisters. I would never I ran because I was scared. That's all. I'm always scared.", "t": 187.41, "d": 12.96}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Okay. For what it's worth, our team pulled that recycling bin yesterday. The paper's still there. Don't leave town again, Jesse.", "t": 200.98, "d": 7.78}, {"sp": "JESSE", "name": "Jesse Cole", "tag": "COLE", "text": "Yes, sir. I won't.", "t": 209.36, "d": 1.6}]}, "03": {"title": "Pastor Ellis Reed — interview", "short": "Pastor Ellis Reed", "sub": "Interview · festival volunteer", "person": "Pastor Ellis Reed", "role": "Pastor, festival volunteer", "date": "4 of 7", "stage": 1, "dur": 203.8, "lines": [{"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Pastor Reed. Thank you for your time.", "t": 0.0, "d": 2.59}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "Of course, Detective. Whatever helps bring Clara home. The whole congregation is praying.", "t": 3.19, "d": 4.81}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You were at the festival Saturday.", "t": 8.61, "d": 2.22}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "The church runs the pie table every year. Booth two, by the entrance. I'm there from four until close. More or less.", "t": 11.43, "d": 8.15}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "More or less.", "t": 20.18, "d": 1.6}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "I wander. A pastor at a festival is half pie-seller, half confessor.", "t": 22.38, "d": 4.44}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You told the sheriff's office you saw Clara arguing that evening.", "t": 27.42, "d": 4.07}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "I did. Around nine, near the bakery booth. Clara and Marcy Tolliver.", "t": 32.1, "d": 4.44}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Could you hear them?", "t": 37.14, "d": 1.6}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "Some. Clara said \"Monday,\" quite firmly. \"I'm going Monday.\" And Marcy said she said, \"You'll ruin me.\" I remember because it was such a strange thing to hear over the smell of kettle corn.", "t": 39.34, "d": 12.59}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Then?", "t": 52.53, "d": 1.6}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "Clara took one of the lanterns off the booth's hook and walked toward the north end. Toward the lake path. It's dark that way. People use the lanterns.", "t": 54.73, "d": 10.37}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "And Marcy?", "t": 65.7, "d": 1.6}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "I couldn't say. I was distracted.", "t": 67.9, "d": 2.22}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "By what?", "t": 70.73, "d": 1.6}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "Parishioner matters.", "t": 72.93, "d": 2.8}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Pastor, I have four people who say you left your booth around nine-fifteen with Deputy Ray Dunn and didn't come back until nearly ten-thirty.", "t": 76.33, "d": 8.89}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "...Ray was unwell.", "t": 85.81, "d": 1.6}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Unwell.", "t": 88.01, "d": 1.6}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "Ray has struggled. With drink. He'd been doing well. Six months. Saturday he wasn't. He'd been at the beer garden since seven. He was off duty, you understand. He wasn't working.", "t": 90.21, "d": 11.48}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Did he argue with Clara, too?", "t": 102.3, "d": 2.22}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "Earlier. Eight o'clock or so, by the beer garden. He said something foolish about the old days. She told him to go home. Thirty seconds. Ray has carried a torch since high school, and everyone knows it. He's harmless.", "t": 105.12, "d": 14.44}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Then why leave it out of your statement?", "t": 120.16, "d": 2.96}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "Because a deputy drunk in public, in a town this size, loses his badge. And a man like Ray without that badge... I've buried men like that, Detective. I made a choice. Perhaps the wrong one.", "t": 123.73, "d": 13.33}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Where did you take him?", "t": 137.66, "d": 1.85}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "My truck. I drove him to his house on Larch Street, made him coffee, and sat with him until he was asleep on the couch. I left around ten-twenty. He did not leave that couch. I'd stake my collar on it.", "t": 140.11, "d": 15.19}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Before you left with him. Did you see anyone follow Clara toward the lake?", "t": 155.9, "d": 5.19}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "...As we walked to the lot, I looked back toward the north end. There was a lantern going up the path. Two, actually. One far ahead. One maybe a minute behind it.", "t": 161.68, "d": 11.85}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Did you see who carried the second?", "t": 174.13, "d": 2.59}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "No face. Small. Shorter than most. Walking fast. I assumed it was a child going to find their mother. I told myself that.", "t": 177.33, "d": 8.52}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "What time?", "t": 186.44, "d": 1.6}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "Nine-fifteen. Ray asked me the time three times in five minutes.", "t": 188.64, "d": 4.07}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Anything else you've left out, Pastor?", "t": 193.32, "d": 2.22}, {"sp": "REED", "name": "Pastor Ellis Reed", "tag": "REED", "text": "Only that I should have walked up that path instead of walking Ray to my truck. I'll carry that.", "t": 196.14, "d": 7.04}]}, "06": {"title": "Clara — voicemail to her lawyer", "short": "Clara's voicemail", "sub": "Saturday, 9:12 PM · to Ruth Kessler", "person": "Clara Hale", "role": "Voicemail, 9:12 PM", "date": "5 of 7", "stage": 1, "dur": 52.7, "lines": [{"sp": "CLARA", "name": "Clara Hale", "tag": "HALE", "text": "Ruth, it's Clara. Sorry, I know it's late, it's Saturday. I'm up on the lake path. I needed air.", "t": 0.0, "d": 7.04}, {"sp": "CLARA", "name": "Clara Hale", "tag": "HALE", "text": "Listen. Forget the house stuff for a second. This isn't about Daniel. The ledger pages are gone. September, October. Just torn out. And the deposits don't match the register tapes. Not by a little.", "t": 7.64, "d": 12.59}, {"sp": "CLARA", "name": "Clara Hale", "tag": "HALE", "text": "I told her tonight. I told her I'm going to the sheriff on Monday. She cried. She said she'd pay it back. Six years, Ruth. I'd have given her the money if she'd just asked.", "t": 20.83, "d": 12.96}, {"sp": "CLARA", "name": "Clara Hale", "tag": "HALE", "text": "But I can't. I can't let her keep doing this. Call me back first thing. I need to know what this does to the partnership agreement before I", "t": 34.39, "d": 10.37}, {"sp": "CLARA", "name": "Clara Hale", "tag": "HALE", "text": "...Hello? Is someone there?", "t": 45.36, "d": 2.8}, {"sp": "CLARA", "name": "Clara Hale", "tag": "HALE", "text": "It's just a lantern. Okay. Call me back, Ruth.", "t": 48.76, "d": 3.33}]}, "04": {"title": "Deputy Ray Dunn — interview", "short": "Deputy Ray Dunn", "sub": "Interview · sheriff's deputy", "person": "Deputy Ray Dunn", "role": "Sheriff's deputy, Clara's ex", "date": "6 of 7", "stage": 2, "dur": 185.6, "lines": [{"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Deputy Dunn.", "t": 0.0, "d": 1.6}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "Detective. Helena sent you all the way up here for a lady who probably drove off to clear her head.", "t": 2.2, "d": 7.41}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Her car's at the trailhead. She didn't drive anywhere.", "t": 10.21, "d": 3.33}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "So she walked. People walk. The lake loop's six miles.", "t": 14.14, "d": 3.7}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "It's been three days.", "t": 18.44, "d": 1.6}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "Yeah, yeah.", "t": 20.64, "d": 1.6}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You were first on scene Sunday morning.", "t": 22.84, "d": 2.59}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "Seven-ish. Jogger called it in. Keys in the ignition, doors unlocked, no phone. Ran the plate, it came back to Clara.", "t": 26.04, "d": 7.78}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You and Clara go back.", "t": 34.41, "d": 1.85}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "High school. Dated junior year. Prom. Big deal. Twenty years ago.", "t": 36.87, "d": 4.07}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You spoke with her Saturday night.", "t": 41.54, "d": 2.22}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "Who says?", "t": 44.36, "d": 2.8}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Pastor Reed. Eventually.", "t": 47.76, "d": 1.6}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "Ellis. Fine. I said hi. She was in a mood.", "t": 49.96, "d": 3.7}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You'd been drinking.", "t": 54.27, "d": 1.6}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "I was off duty. It's a festival. There's a beer garden. That's what it's for.", "t": 56.47, "d": 5.56}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "How much?", "t": 62.62, "d": 1.6}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "Enough that Ellis drove me home. Happy? I was on my couch by ten. Woke up with dispatch yelling in my ear.", "t": 64.82, "d": 8.15}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Hungover at your first scene.", "t": 73.57, "d": 1.85}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "I did my job.", "t": 76.02, "d": 1.6}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Did you? Your notes say \"festival debris\" on the lake path, forty yards from the water. One paper lantern, smashed.", "t": 78.22, "d": 7.41}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "There's lanterns all over that path every year. Kids.", "t": 86.23, "d": 3.33}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Did you bag it?", "t": 90.16, "d": 1.6}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "...I kicked it off the trail.", "t": 92.36, "d": 3.42}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "We recovered it yesterday. Number on the bottom in Sharpie. Fourteen.", "t": 96.39, "d": 4.07}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "So?", "t": 101.06, "d": 1.6}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Booth fourteen was the Hale's Bakery booth. Marcy Tolliver was running it that night. The frame is bent like it was dropped hard, and there's a dark smear on the rocks beside it. The lab has it now.", "t": 103.26, "d": 14.07}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "...Didn't look like anything. It was early. The light was bad.", "t": 117.93, "d": 4.07}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Anything else you didn't think was anything?", "t": 122.61, "d": 2.59}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "The seat. When I opened the door, the driver's seat was jammed all the way up. I had to shove it back just to lean in and check the ignition.", "t": 125.8, "d": 11.11}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You moved it.", "t": 137.51, "d": 1.6}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "I put it back where it was! All the way up. Look, Clara's tall. I remember thinking, huh, that's weird. Then I figured... I don't know what I figured. I had a headache.", "t": 139.71, "d": 12.22}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Did you see Clara leave the festival?", "t": 152.53, "d": 2.59}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "...I saw her heading north with a lantern while Ellis was dragging me to his truck. And Marcy Tolliver. She was over by the porta-johns at the edge of the lot. That's right where the path starts. She had a lantern, too. Didn't think anything of it. Marcy's always fussing around.", "t": 155.73, "d": 18.89}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "That's not in any report.", "t": 175.21, "d": 1.85}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "I wasn't on duty.", "t": 177.67, "d": 1.6}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You're on duty now, Deputy. Write it down.", "t": 179.87, "d": 2.96}, {"sp": "DUNN", "name": "Deputy Ray Dunn", "tag": "DUNN", "text": "...Yeah. Fine.", "t": 183.43, "d": 1.6}]}, "05": {"title": "Marcy Tolliver — interview", "short": "Marcy Tolliver", "sub": "Interview · Clara's business partner", "person": "Marcy Tolliver", "role": "Business partner", "date": "7 of 7", "stage": 2, "dur": 313.4, "lines": [{"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Ms. Tolliver. Have a seat.", "t": 0.0, "d": 1.85}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Oh, thank you, yes. Sorry, I'm a mess, I haven't slept. I brought scones, they're with the lady at the front desk. Lemon poppyseed. Clara's recipe, actually, it's it's her recipe. Sorry.", "t": 2.45, "d": 11.85}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "That's kind of you. You and Clara are partners.", "t": 14.9, "d": 3.33}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Six years. Forty-sixty, her sixty. I do the front, the ordering, the register, the people stuff. Clara's the genius. Clara does the books. I don't even, I'm hopeless with numbers, ask anybody.", "t": 18.84, "d": 11.85}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Tell me about Saturday.", "t": 31.29, "d": 1.6}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Big day. Biggest day of the year for us. Booth fourteen. I sold out of cider donuts by seven, it was amazing, actually. Jesse was there until, oh, I sent him home early, he looked tired, poor kid. Clara came by around eight-thirty? She was fine. Totally fine. We talked about Christmas orders.", "t": 33.49, "d": 19.63}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Christmas orders.", "t": 53.72, "d": 1.6}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Yule logs. She wanted to do yule logs this year.", "t": 55.92, "d": 3.7}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Pastor Reed heard you two arguing near nine. He heard you say, \"You'll ruin me.\"", "t": 60.22, "d": 5.56}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Oh, that! No, that was about the yule logs. Clara wanted to order the good chocolate, the Belgian, and I said, \"Clara, you'll ruin me,\" like a joke, you know, like... It was a joke.", "t": 66.38, "d": 12.96}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "What time did you leave the festival?", "t": 79.94, "d": 3.79}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Nine-thirty. I packed up, well, mostly, I left the tent for the morning, and drove straight home. Watched a cooking show and fell asleep on the couch. Very exciting life.", "t": 84.33, "d": 11.11}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "You drove.", "t": 96.04, "d": 1.6}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "My Corolla. The little blue one.", "t": 98.24, "d": 2.22}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Your Corolla was still in the festival lot at six Sunday morning. It's in the cleanup crew's photos.", "t": 101.07, "d": 6.67}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Oh. Right, I, did I? I must have... I'd had a cider. A hard cider. One. I didn't want to drive, so I walked. I walked home. That's right. It was a nice night, the air was...", "t": 108.33, "d": 13.7}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Which way?", "t": 122.64, "d": 1.6}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Main Street. Straight down.", "t": 124.84, "d": 1.6}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "This is the Gas-N-Go camera on Route 9. Ten-forty PM. That's you. Alone.", "t": 127.04, "d": 4.81}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "...Okay. Yes. That's me.", "t": 132.45, "d": 2.8}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Route 9 comes into town from the lake side. Not from the festival. And it's ten-forty. Not nine-thirty.", "t": 135.85, "d": 6.67}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "I took the long way, I needed to think, I've had a lot on my mind. Business stuff. It's a hard year for small businesses, everybody knows that, the price of butter alone. And I lost track of time, I do that, I'm terrible with time.", "t": 143.12, "d": 17.04}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "What were you thinking about?", "t": 160.76, "d": 1.85}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Just stuff. Money stuff. Not, I mean, not like that. I don't gamble or anything. I play the scratchers. And the machines at the Silver Spur sometimes, in Butte, but everybody does, that's not...", "t": 163.21, "d": 12.59}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Nobody asked if you gamble, Ms. Tolliver.", "t": 176.4, "d": 2.59}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "No. I know. I'm just talking. I talk when I'm nervous.", "t": 179.59, "d": 4.07}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "We found a smashed lantern on the lake path.", "t": 184.27, "d": 3.33}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Somebody took one of mine. I was short one at the end of the night. People do that, they don't bring them back, I keep telling Clara the dollar deposit isn't enough.", "t": 188.2, "d": 11.85}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "I didn't say it was yours.", "t": 200.65, "d": 2.22}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "...Well. I just assumed. Everybody had our lanterns. They were very popular.", "t": 203.47, "d": 5.64}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Where do you think Clara is, Ms. Tolliver?", "t": 209.72, "d": 2.96}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "I don't know! I've been sick about it. She walks up there when she's upset, she always has, and those rocks by the old boathouse are slick as anything after dark. I've told her a hundred times. She could have slipped and hit her head and", "t": 213.28, "d": 17.04}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Nobody has mentioned the boathouse to you.", "t": 230.92, "d": 2.59}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "It's the lake, Detective. The boathouse is the only thing up there. Everybody knows the boathouse.", "t": 234.11, "d": 5.93}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Or her hitting her head.", "t": 240.64, "d": 1.85}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "I said could have. Could have. I imagine the worst. It's an anxiety thing.", "t": 243.09, "d": 5.19}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Let's talk about the books.", "t": 248.87, "d": 1.85}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Clara does the books.", "t": 251.33, "d": 1.6}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Jesse says you brought a shredder from home the Wednesday before the festival.", "t": 253.53, "d": 4.81}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "For invoices. Old invoices. Paper clutter. I'm a tidy person.", "t": 258.94, "d": 3.7}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "We pulled the bakery recycling. Shredded ledger paper. Green. Clara's ledger is missing eleven pages. September and October.", "t": 263.24, "d": 6.67}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Well then it must have been Clara who, she must have redone them, she redoes things. Look, if there's money missing, it's the card reader. That card reader has been glitching since summer, I've told her...", "t": 270.51, "d": 13.33}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "I didn't say there was money missing.", "t": 284.44, "d": 3.79}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "...Why else would you care about a ledger?", "t": 288.84, "d": 4.16}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "How tall are you, Ms. Tolliver?", "t": 293.6, "d": 2.22}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "What? Five-two. Five-two and a half. Why does that...", "t": 296.42, "d": 3.33}, {"sp": "ORTIZ", "name": "Det. Sam Ortiz", "tag": "DET. ORTIZ", "text": "Clara is five-ten. Her driver's seat was pushed all the way forward. Whoever drove her car to that trailhead needed it that way to reach the pedals.", "t": 300.36, "d": 10.0}, {"sp": "MARCY", "name": "Marcy Tolliver", "tag": "TOLLIVER", "text": "Lots of people are short.", "t": 310.96, "d": 1.85}]}}, "pages": [{"tab": "Summary", "kicker": "CASE SUMMARY", "title": "Case summary", "html": "<div class=\"pgn\">Clara Hale, 34 — missing</div><p>Owner of Hale's Bakery on Main Street, Pine Hollow, Montana. 5'10\".</p><p>Seen at the Harvest Festival a little after 9 PM Saturday. By 7 the next morning her Subaru was at the Copper Lake trailhead: doors unlocked, keys in the ignition, phone gone.</p><p class=\"hand\">Your job: help Det. Ortiz work out what happened Saturday night.</p>"}, {"tab": "People", "kicker": "PEOPLE · PERSON OF INTEREST", "title": "Daniel Hale", "html": "<div style=\"display:flex;gap:14px\"><img src=\"assets/print-daniel.jpg\" style=\"width:104px;height:142px;box-shadow:0 3px 8px rgba(0,0,0,.3);transform:rotate(-2deg);flex:none\" alt=\"Daniel Hale (placeholder portrait)\"><div><div class=\"pgn\">Daniel Hale</div><dl><dt>Who</dt><dd>Clara's husband. They are separating.</dd><dt>Says</dt><dd>Met Clara at the trailhead ~4 PM. She drove off first, ~4:10.</dd><dt>Note</dt><dd>Wears size-13 Red Wings. A size-13 boot print was found by her car.</dd></dl></div></div><p class=\"hand\" style=\"margin-top:12px\">Dock photo on his phone: 3:52 PM.</p>"}, {"tab": "People", "kicker": "PEOPLE · WITNESS", "title": "Jesse Cole", "html": "<div style=\"display:flex;gap:14px\"><img src=\"assets/print-jesse.jpg\" style=\"width:104px;height:142px;box-shadow:0 3px 8px rgba(0,0,0,.3);transform:rotate(-2deg);flex:none\" alt=\"Jesse Cole (placeholder portrait)\"><div><div class=\"pgn\">Jesse Cole</div><dl><dt>Who</dt><dd>Works at the bakery. 19 years old.</dd><dt>Says</dt><dd>Left the festival early, at 8:45 PM.</dd><dt>Note</dt><dd>Says Marcy sent him home.</dd></dl></div></div><p class=\"hand\" style=\"margin-top:12px\">Mentions shredded paper in the bakery recycling.</p>"}, {"tab": "People", "kicker": "PEOPLE · WITNESS", "title": "Pastor Ellis Reed", "html": "<div style=\"display:flex;gap:14px\"><img src=\"assets/print-reed.jpg\" style=\"width:104px;height:142px;box-shadow:0 3px 8px rgba(0,0,0,.3);transform:rotate(-2deg);flex:none\" alt=\"Pastor Ellis Reed (placeholder portrait)\"><div><div class=\"pgn\">Pastor Ellis Reed</div><dl><dt>Who</dt><dd>Pastor and festival volunteer.</dd><dt>Says</dt><dd>Overheard Clara and Marcy by the bakery booth ~9 PM.</dd><dt>Note</dt><dd>Clara: \"I'm going Monday.\" Marcy: \"You'll ruin me.\"</dd></dl></div></div><p class=\"hand\" style=\"margin-top:12px\">Left the festival with Deputy Dunn ~9:15.</p>"}, {"tab": "Reports", "kicker": "POLICE REPORT · VEHICLE", "title": "Police report: the car", "html": "<img src=\"assets/form-report.jpg\" style=\"width:100%;max-height:250px;object-fit:contain;object-position:top\" alt=\"Vehicle report form\"><p style=\"margin-top:8px\">Sun. 7:00 AM, Copper Lake trailhead lot (off Route 9). Keys in the ignition. Phone not found. Driver's seat pulled all the way forward. Size-13 boot print beside the car.</p>"}, {"tab": "Reports", "kicker": "EVIDENCE LIST", "title": "Evidence list", "html": "<p><b>Muddy boot print + 3:52 photo</b><br>Size 13 work-boot print, heel worn on the left, found beside Clara's Subaru in the Copper Lake trailhead lot (off Route 9). Daniel Hale wears Red Wings. He produced a phone photo of the dock, time-stamped 3:52 PM Saturday with location, placing him at the trailhead that afternoon.</p><p><b>Voicemail to attorney (9:12 PM)</b><br>Clara left a message for her lawyer, Ruth Kessler, at 9:12 PM. Wind in the pines, footsteps on gravel, festival music fading behind her.</p><p><b>Bakery ledger, missing pages</b><br>Eleven pages (Sept. and Oct.) cut out.</p>"}, {"tab": "Timeline", "kicker": "TIMELINE · WHAT WE KNOW SO FAR", "title": "Timeline", "html": "<ul class=\"tl\"><li><b>Sat ~4:00 PM</b><span>Clara meets Daniel at the Copper Lake trailhead. His dock photo is stamped 3:52 PM.</span></li><li><b>Sat ~4:10 PM</b><span>Clara drives off first. Daniel sits in his truck a while, then goes home.</span></li><li><b>Sat 6:00 PM</b><span>Harvest Festival opens on the north field. Battery lanterns strung toward the lake path.</span></li><li><b>Sat 8:45 PM</b><span>Jesse leaves the festival early. Marcy sent him home.</span></li><li><b>Sat ~9:00 PM</b><span>Pastor Reed overhears Clara and Marcy by the bakery booth.</span></li><li><b>Sat 9:12 PM</b><span>Clara calls her attorney from the lake path.</span></li><li><b>Sat ~9:15 PM</b><span>Clara takes a lantern from booth 14 and walks up the lake path.</span></li><li><b>Sun 7:00 AM</b><span>Clara's car found at the Copper Lake trailhead.</span></li></ul>"}, {"tab": "Map", "kicker": "MAP OF PINE HOLLOW", "title": "Map of Pine Hollow", "html": "<img src=\"assets/map.jpg\" style=\"width:100%;height:330px;object-fit:contain\" alt=\"Map of Pine Hollow\">"}], "obj": [{"q": "Where was Clara last seen going, and when?", "o": ["Home from the festival around 8:30 PM", "Up the lake path, just after 9 PM", "Into the Gas-N-Go at 10:40 PM", "Away from the trailhead at 4:10 PM, never seen again"], "a": 1}, {"q": "Did Clara drive her own car to the trailhead that night?", "o": ["Yes, she drove there and walked to the lake", "No, she walked up from the festival; someone else drove the car there later", "The car was towed there"], "a": 1}, {"q": "Daniel's boot print beside the car was made…", "o": ["Saturday night, when he followed Clara", "At the 4 PM trailhead meeting, proven by his 3:52 photo", "By Deputy Dunn while searching"], "a": 1}], "hints": ["Clara was on foot at the festival. Listen to what is behind her voice on the voicemail.", "Pastor Reed's interview and the 9:12 voicemail place her. Daniel's interview explains the boot print.", "She walked up the lake path right after 9 (Reed + voicemail). The seat was jammed forward, which a 5'10\" driver would never do. Daniel's 3:52 dock photo dates his print to the afternoon."], "ev": {"boot": {"n": "Muddy boot print + 3:52 photo", "d": "Size 13 work-boot print, heel worn on the left, found beside Clara's Subaru in the Copper Lake trailhead lot (off Route 9). Daniel Hale wears Red Wings. He produced a phone photo of the dock, time-stamped 3:52 PM Saturday with location, placing him at the trailhead that afternoon.", "note": "Daniel says Clara asked to meet him at the trailhead around 4 PM, and that she drove off first, around 4:10."}, "voicemail": {"n": "Voicemail to attorney (9:12 PM)", "d": "Clara left a message for her lawyer, Ruth Kessler, at 9:12 PM. Wind in the pines, footsteps on gravel, festival music fading behind her."}, "ledger": {"n": "Bakery ledger, missing pages", "d": "Clara's big green handwritten ledger. Eleven pages, September and October, have been cut out. Jesse mentions shredded paper in the bakery recycling.", "note": "Clara kept the books. Who ran the register?"}, "lantern": {"n": "Smashed festival lantern", "d": "Paper festival lantern found crushed on the lake path near the rocks by the old boathouse. \"14\" in Sharpie on the base. Frame bent as if dropped hard; a dark smear on the rocks beside it. Recovered by Deputy Dunn and logged late.", "note": "Booth 14 at the Harvest Festival was the Hale's Bakery booth, run that night by Marcy Tolliver."}, "seat": {"n": "Car seat position", "d": "Clara's Subaru at the Copper Lake trailhead. Driver seat jammed all the way forward. Clara is 5'10\" and drives with the seat all the way back.", "note": "Deputy Dunn admits he moved the seat, then put it back \"all the way up.\""}, "camera": {"n": "Gas station camera still", "d": "Gas-N-Go on Route 9, camera 2, 10:40 PM Saturday. A short figure walks alone into town. Route 9 comes in from the lake side, not from the festival."}}, "art": {"lantern": "<svg viewBox=\"0 0 200 120\"><path d=\"M70 30h60l-8 60H78z\" fill=\"#d9a44133\" stroke=\"#d9a441\"/><path d=\"M85 45l15 20-10 15M120 40l-12 30\" stroke=\"#0a0d10\" stroke-width=\"3\"/><text x=\"100\" y=\"72\" fill=\"#d9a441\" font-size=\"22\" text-anchor=\"middle\" font-family=\"monospace\">14</text><line x1=\"100\" y1=\"10\" x2=\"100\" y2=\"30\" stroke=\"#888\"/></svg>", "seat": "<svg viewBox=\"0 0 200 120\"><rect x=\"20\" y=\"95\" width=\"160\" height=\"4\" fill=\"#555\"/><path d=\"M110 90h40v-8h-40zM140 82l15-55h8l-14 55z\" fill=\"#5a4a3a\"/><path d=\"M60 50l20-15\" stroke=\"#888\" stroke-width=\"5\"/><circle cx=\"58\" cy=\"52\" r=\"14\" fill=\"none\" stroke=\"#888\" stroke-width=\"3\"/><path d=\"M150 100h-35\" stroke=\"#d9a441\" stroke-dasharray=\"3\"/><text x=\"132\" y=\"113\" fill=\"#d9a441\" font-size=\"9\" text-anchor=\"middle\" font-family=\"monospace\">◀ FULL FORWARD</text></svg>", "camera": "<svg viewBox=\"0 0 200 120\"><rect width=\"200\" height=\"120\" fill=\"#1a1f1a\"/><rect x=\"20\" y=\"70\" width=\"160\" height=\"2\" fill=\"#333\"/><circle cx=\"120\" cy=\"58\" r=\"5\" fill=\"#555\"/><rect x=\"116\" y=\"63\" width=\"8\" height=\"18\" fill=\"#555\"/><text x=\"6\" y=\"12\" fill=\"#ddd\" font-size=\"9\" font-family=\"monospace\">CAM2 SAT 22:40:13</text><text x=\"6\" y=\"114\" fill=\"#ddd\" font-size=\"8\" font-family=\"monospace\">GAS-N-GO RTE 9</text><rect width=\"200\" height=\"120\" fill=\"url(#n)\" opacity=\".3\"/></svg>"}, "board": {"items": [{"id": "ortiz", "kind": "person", "name": "Det. Sam Ortiz", "label": "Det. Sam Ortiz", "role": "Lead investigator", "about": "Montana State Police detective leading the case. His is the voice asking the questions on every recording.", "rec": "00", "img": "assets/print-ortiz.jpg", "x": 75.2, "y": 113.9090909090909, "w": 89.6, "h": 122.18181818181819, "rot": 0}, {"id": "daniel", "kind": "person", "name": "Daniel Hale", "label": "Daniel Hale", "role": "Husband (separating)", "about": "Clara's husband; they are separating. Met Clara at the Copper Lake trailhead ~4 PM Saturday. Wears size-13 Red Wings.", "rec": "01", "img": "assets/print-daniel.jpg", "x": 318.8, "y": 125.18181818181819, "w": 102.4, "h": 139.63636363636363, "rot": 0}, {"id": "clara", "kind": "person", "name": "Clara Hale", "label": "Clara Hale", "role": "MISSING · bakery owner", "about": "34, 5'10\". Owns Hale's Bakery. Seen at the Harvest Festival a little after 9 PM Saturday. Left a voicemail for her lawyer at 9:12 PM.", "rec": "06", "img": "assets/print-clara.jpg", "x": 576.0, "y": 157.72727272727272, "w": 128.0, "h": 174.54545454545456, "rot": 0}, {"id": "reed", "kind": "person", "name": "Pastor Ellis Reed", "label": "Pastor Ellis Reed", "role": "Saw Clara ~9 PM", "about": "Pastor and festival volunteer. Overheard Clara and Marcy by the bakery booth ~9 PM. , the festival field, Main Street and the lake path up to Copper Lake.", "rec": null, "img": "assets/doc-map.jpg", "x": 499.2, "y": 466.44, "w": 281.6, "h": 197.12, "rot": 0}, {"id": "form_report", "kind": "doc", "name": "Police report: the car", "label": "Police report: the car", "place": false, "role": null, "about": "Vehicle report: keys in the ignition, phone not found, driver's seat pulled all the way forward, size-13 boot print beside the car.", "rec": null, "img": "assets/doc-form-report.jpg", "x": 198.2, "y": 555.8, "w": 153.6, "h": 198.4, "rot": -2}, {"id": "card_bakery", "kind": "doc", "name": "Hale's Bakery", "label": "Hale's Bakery", "place": true, "role": null, "about": "Clara's bakery on Main Street — \"the warmest room in town for six years.\"", "rec": null, "img": "assets/doc-card-bakery.jpg", "x": 918.72, "y": 616.36, "w": 162.56, "h": 97.28, "rot": 3}, {"id": "ledger", "kind": "doc", "name": "Bakery ledger", "label": "Bakery ledger", "place": false, "role": null, "about": "Clara's big green handwritten ledger. Eleven pages, September and October, have been cut out. Jesse mentions shredded paper in the bakery recycling.", "rec": null, "img": "assets/doc-ledger.jpg", "x": 1107.4, "y": 605.12, "w": 115.2, "h": 149.76, "rot": 4}, {"id": "newspaper", "kind": "doc", "name": "Newspaper", "label": "Newspaper", "place": false, "role": null, "about": "Local coverage of the disappearance (placeholder masthead and text).", "rec": null, "img": "assets/doc-newspaper.jpg", "x": 389.48, "y": 555.8, "w": 151.04, "h": 198.4, "rot": 2}, {"id": "sticky_seat", "kind": "doc", "name": "Note: driver's seat", "label": null, "place": false, "role": null, "about": "Seat pulled all the way forward. Clara is 5'10\" and drives with it all the way back.", "rec": null, "img": "assets/doc-sticky-seat.jpg", "x": 761.36, "y": 651.36, "w": 97.28, "h": 97.28, "rot": -4}, {"id": "sticky_vm", "kind": "doc", "name": "Note: voicemail", "label": null, "place": false, "role": null, "about": function drawPage(){ const PG = C.pages, p = PG[S.page];
  $('#pgl').innerHTML = `<div class="pgk"><span>INSIDE COVER · CONTENTS</span></div><ol class="toc">${PG.map((x,i) => `<li><button data-go="${i}" class="${i===S.page?'cur':''} ${S.seenPages[i]?'seen':''}"><span>${esc(x.title)}</span><i>p. ${i+1}</i></button></li>`).join('')}</ol>`;
  const body = `<div class="pgk"><span>${esc(p.kicker)}</span><span>p. ${S.page+1} of ${PG.length}</span></div>${p.html}`;
  $('#pgr').innerHTML = body + (S.page < PG.length-1 ? '<button class="curl" data-turn="1" aria-label="Turn the page"><span>Turn page ↷</span></button>' : '');
  $('#pgn').innerHTML = body;

  $('#tabs').innerHTML = tabs.map(t => `<button data-tab="${t}" class="${p.tab===t?'on':''}">${t}</button>`).join('');
  $$('[data-go]').forEach(b => b.onclick = () => goPage(+b.dataset.go)); $$('[data-tab]').forEach(b => b.onclick = () => goPage(PG.findIndex(x => x.tab === b.dataset.tab)));
  $$('#pgr [data-turn]').forEach(b => b.onclick = () => turn(1));
  $$('[data-turn="-1"]').forEach(b => b.disabled = S.page === 0); $$('.fctl [data-turn="1"]').forEach(b => b.disabled = S.page === PG.length-1);
  if (Object.keys(S.seenPages).length >= PG.length && !S.read.file) { S.read.file = true; save(); toast('✓ You’ve read the whole case file'); renderNext(); }
}
function goPage(n){ if (n === S.page || n < 0 || n >= C.pages.length) return; const fwd = n > S.page; const st = $('.fstage');
  if (st && getComputedStyle($('.fwide')).display !== 'none') { const f = document.createElement('div'); f.className = 'flip' + (fwd ? '' : ' rev'); f.innerHTML = fwd ? $('#pgr').innerHTML : ''; f.style.padding = '16px 18px'; st.appendChild(f); setTimeout(() => f.remove(), 520); }
  S.page = n; S.seenPages[n] = true; save(); setTimeout(drawPage, fwd ? 120 : 0); }
function turn(d){ goPage(S.page + d); }

function ovBag(){
  $('#ov').innerHTML = `<div class="ovw"><div><div class="bagw" id="bagw"><div class="bagin"><div class="bagface"><img src="${A.bag}" alt="Evidence bag holding the bakery ledger" draggable="false"></div>
