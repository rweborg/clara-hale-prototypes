   <div class="fctl" style="margin-top:10px"><button class="btn2" id="bflip">↻ Turn it over</button><button class="btn2 on" id="bmag">🔍 Magnifier: on</button><button class="btn2" id="bout">📄 Take the page out</button></div></div>
   ${side('<div class="panel"><h3>' + esc(C.ev.ledger.n) + '</h3><p>' + esc(C.ev.ledger.d) + '</p><p class="hand" style="margin-top:8px">' + esc(C.ev.ledger.note) + '</p></div><div class="panel"><h3>Try this</h3><p>Move the magnifier over the rows for Aug. 29 and 30. Compare <b>Register</b> (what was sold) with <b>Bank</b> (what was deposited).</p></div>')}</div>`;
  const w = $('#bagw'), lp = $('#loupe'); w.classList.add('mag'); let moved = false;
  lp.style.backgroundImage = `url(${A.ledger})`;
  const place = (cx, cy) => { const r = w.getBoundingClientRect(); const k = r.width / 800; const x = cx - r.left, y = cy - r.top; const ix = x / k, iy = y / k;
    const tx = (ix - 205) / .675, ty = (iy - 163) / .675, z = 1.25, L = 110; lp.style.left = (x - L) + 'px'; lp.style.top = (y - L) + 'px';
    lp.style.backgroundSize = (600 * z) + 'px ' + (780 * z) + 'px'; lp.style.backgroundPosition = (L - 9 - tx * z) + 'px ' + (L - 9 - ty * z) + 'px';
    if (!moved && tx > 0 && ty > 150 && ty < 260) { moved = true; S.read.bag = true; save(); renderNext(); } };
  w.addEventListener('pointermove', e => { if (w.classList.contains('mag') && !w.classList.contains('flipped')) place(e.clientX, e.clientY); });
  w.addEventListener('pointerdown', e => { if (w.classList.contains('mag')) place(e.clientX, e.clientY); });
  requestAnimationFrame(() => { const r = w.getBoundingClientRect(), k = r.width/800; place(r.left + 470*k, r.top + 300*k); moved = false; });
  $('#bflip').onclick = () => { w.classList.toggle('flipped'); $('#bflip').textContent = w.classList.contains('flipped') ? '↻ Turn it back' : '↻ Turn it over'; };
  $('#bmag').onclick = () => { w.classList.toggle('mag'); $('#bmag').classList.toggle('on'); $('#bmag').textContent = w.classList.contains('mag') ? '🔍 Magnifier: on' : '🔍 Magnifier: off'; };
  $('#bout').onclick = () => { S.read.bag = true; save(); $('#ov').innerHTML = `<div class="ovw"><div style="text-align:center"><img class="ledgerfull" src="${A.ledger}" alt="Ledger page, August 2025"><div class="fctl" style="margin-top:12px"><button class="btn2" id="bback">↩ Put it back in the bag</button></div></div>${side('<div class="panel"><h3>Ledger page 47 · August 2025</h3><p>The last page before the 11 missing ones. Figures are sample placeholders.</p></div>')}</div>`; $('#bback').onclick = ovBag; renderNext(); };
}

     ${ok ? '<button class="strip" id="strip" aria-label="Tear the envelope open"><span>Drag along the dashed line to tear →</span><i class="grip" id="grip" style="left:12px">✂</i></button>' : '<div class="lock">🔒 <span><b>Sealed.</b> Answer Objective 1 correctly to open this envelope.</span></div>'}</div>
     <div class="fctl" style="margin-top:18px">${ok ? '<button class="btn2 on" id="tearbtn">✂ Tear it open</button>' : '<button class="btn2 on" id="toobj">✏️ Answer Objective 1</button>'}<button class="btn2" id="envbc">✉️ Envelopes B and C</button></div></div>

  if (!ok) { $('#toobj').onclick = () => openOv('obj'); }
  else { $('#tearbtn').onclick = doTear; const st = $('#strip'), g = $('#grip'); let drag = false;

function ovObj(){ const Q = C.obj;

   ${B.items.filter(it => it.label).map(it => `<div class="blab ${it.kind==='person'?(it.id==='clara'?'miss':''):(it.place?'place':'')}" style="left:${X(it.x + it.w/2)}%;top:${Y(it.y + it.h) - 1.5}%">${esc(it.label)}${it.role?`<small>${esc(it.role)}</small>`:''}</div>`).join('')}`;

function selNone(){ SEL = null; $('#bwrap').classList.remove('sel'); $$('.bi').forEach(b => b.classList.remove('me','rel')); $$('.bsvg line').forEach(l => l.classList.remove('on'));
  $('#selp').innerHTML = '<h3>📌 Tap anything on the board</h3><p>Tap a photo, card or note to see what it is. Its red strings light up to show what it’s linked to. You can also tap a string.</p>'; }
function selItem(id){ const B = C.board, it = B.items.find(x => x.id === id); SEL = {i:id};
  const rel = B.links.map((l,i) => ({l,i})).filter(o => o.l.a === id || o.l.b === id);
  $('#bwrap').classList.add('sel'); $$('.bi').forEach(b => { b.classList.toggle('me', b.dataset.bi === id); b.classList.toggle('rel', rel.some(o => o.l.a === b.dataset.bi || o.l.b === b.dataset.bi) && b.dataset.bi !== id); });
  $$('.bsvg line[data-l]').forEach(l => l.classList.toggle('on', rel.some(o => o.i === +l.dataset.l)));
  $('#selp').innerHTML = `<div class="selp"><img src="${it.img}" alt=""><h3>${esc(it.name)}</h3><p>${esc(it.about)}</p>
    ${rel.length ? `<div style="margin-top:8px;font:700 12px Atkinson;letter-spacing:.1em;color:#B3141B">🧶 LINKED TO</div>` + rel.map(o => { const other = o.l.a === id ? o.l.b : o.l.a; const ot = B.items.find(x => x.id === other); return `<button class="conn" data-go="${other}"><b>${esc(ot.name)}</b>${esc(o.l.why)}</button>`; }).join('') : ''}
    <div class="fctl" style="margin-top:10px;justify-content:flex-start"><button class="btn2" id="bopen">🔍 Open</button>${it.rec && recUnlocked(it.rec) ? '<button class="btn2" id="brec">▶ Play</button>' : ''}<button class="btn2" id="bclr">✕ Clear</button></div></div>`;
  $$('#selp [data-go]').forEach(b => b.onclick = () => selItem(b.dataset.go));
  $('#bopen').onclick = () => openOv('prev', id); $('#bclr').onclick = selNone; const br = $('#brec'); if (br) br.onclick = () => openOv('rec', it.rec);
}
function selLink(i){ const B = C.board, l = B.links[i]; SEL = {l:i}; const a = B.items.find(x => x.id === l.a), b = B.items.find(x => x.id === l.b);
  $('#bwrap').classList.add('sel'); $$('.bi').forEach(x => { x.classList.toggle('me', false); x.classList.toggle('rel', x.dataset.bi === l.a || x.dataset.bi === l.b); });
  $$('.bsvg line[data-l]').forEach(x => x.classList.toggle('on', +x.dataset.l === i));
  $('#selp').innerHTML = `<h3>🧶 ${esc(a.name)} ↔ ${esc(b.name)}</h3><p>${esc(l.why)}</p><div class="fctl" style="margin-top:10px;justify-content:flex-start"><button class="btn2" data-go="${l.a}">${esc(a.name)}</button><button class="btn2" data-go="${l.b}">${esc(b.name)}</button></div>`;
  $$('#selp [data-go]').forEach(x => x.onclick = () => selItem(x.dataset.go)); }
function newTray(){ const t = $('#newtray'); if (!S.envOpen) { t.innerHTML = '<h3>✉️ Envelope A</h3><p class="empty">Still sealed. New evidence appears here after you open it.</p>'; return; }
  t.innerHTML = '<h3>🆕 New from Envelope A</h3>' + C.envA.map(x => `<button class="it" data-envit2="${x.id}"><span>${x.icon}</span><div><b>${esc(x.n)}</b><small>${esc(x.sub)}</small></div><i>${x.rec?'Play':'Look'}</i></button>`).join('');
  $$('[data-envit2]').forEach(b => b.onclick = () => { const x = C.envA.find(y => y.id === b.dataset.envit2); if (x.rec) openOv('rec', x.rec); else openOv('ev', x.id); }); }

// ---------- boot ----------
function boot(){
  $('#hdesk').innerHTML = hots(C.desk.hot); $('#hmob').innerHTML = hots(C.mdesk.hot);
  $$('.hot').forEach(h => h.onclick = () => HOTACT[h.dataset.name]());
  $$('.seg button').forEach(b => b.onclick = () => setView(b.dataset.v));
  $('.back button').onclick = closeOv;
  $('#hint').onclick = () => openOv('obj');
  $('#restart').onclick = () => { if (confirm('Start the case over? This clears your progress on this device.')) { localStorage.removeItem(KEY); location.reload(); } };
  $('#ovbg').style.backgroundImage = `url(${A.desk})`;
  setView(S.view === 'board' ? 'board' : 'desk');
  const h = location.hash.slice(1); if (h) { const [k, a] = h.split(':'); if (k === 'board') setView('board'); else if (k === 'sel') { setView('board'); selItem(a); } else if (k === 'link') { setView('board'); selLink(+a); } else if (['rec','file','bag','env','obj','sheet','pad','news','prev','ev'].includes(k)) openOv(k, a); }
  window.__proto = {S, openOv, closeOv, setView, selItem, selLink, play, pause, seek, P, doTear, turn};
}
boot();
})();
